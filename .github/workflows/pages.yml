# The Lumap site on GitHub Pages: the landing page and the update manifests the app checks
# (README.md). It is rebuilt when site/ changes, when a release is published, or by hand:
# run it with a channel and a version to point that channel at the version (it commits
# site/channels.json for you). Nothing reaches users until a channel points at it.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site-build.mjs", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to move (empty: just rebuild the site)"
        type: choice
        options: ["", "stable", "beta"]
        default: ""
      version:
        description: "Version it offers from now on, e.g. 0.1.0-beta.8 (empty: offer nothing)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A published release runs on its tag, which may not deploy Pages: rebuild from main instead,
  # but only when a channel already offers that version. Otherwise nothing on the site changes,
  # and a rebuild queued now would push out a channel move started at the same time (a
  # concurrency group keeps one waiting run).
  from-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          channels=$(gh api "repos/$GITHUB_REPOSITORY/contents/site/channels.json?ref=main" --jq .content | base64 -d)
          if echo "$channels" | grep -q "\"${TAG#v}\""; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "No channel offers $TAG yet: nothing to rebuild."
          fi

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Point the channel at the version
        if: github.event_name == 'workflow_dispatch' && inputs.channel != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/site-build.mjs set "$CHANNEL" "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "the $CHANNEL channel already offers ${VERSION:-nothing}"
          else
            git commit -am "Site: the $CHANNEL channel offers ${VERSION:-nothing}"
            git push
          fi
      - name: Build the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/site-build.mjs build _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
